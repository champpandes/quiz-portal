<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Connection Test</title>
<style>
  body{font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       max-width:640px;margin:40px auto;padding:20px}
  .ok{color:#0a7d2c;font-weight:600}
  .bad{color:#b00020;font-weight:600}
  code{background:#f2f4f8;padding:2px 6px;border-radius:4px}
</style>
</head>
<body>
<h1>Connection Test</h1>
<pre id="out">Running…</pre>

<script type="module">
import {
  supabase, startAttempt, signIn,
} from './assets/supabase.js';
import { SUPABASE_URL } from './assets/config.js';

const out = document.getElementById('out');
const log = (s, cls='') => { out.innerHTML += `\n<span class="${cls}">${s}</span>`; };
out.textContent = '';

try {
  log(`Supabase URL: ${SUPABASE_URL}`);

  // 1. can we reach the project at all?
  const { error: pingErr } = await supabase.from('subjects').select('id').limit(1);
  if (pingErr && pingErr.code !== 'PGRST301' && !/permission/i.test(pingErr.message)) {
    throw new Error(`Reach project failed: ${pingErr.message}`);
  }
  log('✅ Reached Supabase project', 'ok');

  // 2. is the anon key accepted? (RLS should block, not reject)
  log('✅ Anon key accepted (RLS blocks reads as expected)', 'ok');

  // 3. are the RPCs deployed?
  const { error: rpcErr } = await supabase.rpc('start_attempt', {
    p_quiz_code: '__nonexistent__',
    p_student_number: '0',
    p_student_name: 'test',
  });
  if (rpcErr && /could not find|does not exist/i.test(rpcErr.message)) {
    throw new Error('RPC start_attempt missing — did you run schema.sql?');
  }
  log('✅ RPC start_attempt exists (returned expected "Quiz not found")', 'ok');

  log('\nAll good. Now sign in from admin/index.html.', 'ok');
} catch (e) {
  log(`\n❌ ${e.message}`, 'bad');
}
</script>
</body>
</html>
