<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live · Quiz Platform Champ</title>
<link rel="icon" type="image/svg+xml" href="../assets/logo-icon.svg">
<link rel="stylesheet" href="../assets/admin/admin.css">
<style>
  .live-head { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
  .live-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #16a34a;
              animation: pulse 1.6s infinite; margin-right: 6px; vertical-align: middle; }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .45; transform: scale(.85); } }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 18px 0 22px; }
  .tile-stat { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 16px; box-shadow: var(--shadow-xs); }
  .tile-stat .lbl { font-size: .78rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; }
  .tile-stat .num { font-size: 1.7rem; font-weight: 800; margin-top: 4px; letter-spacing: -0.02em; }
  .tile-stat.live   .num { color: var(--primary); }
  .tile-stat.warn   .num { color: var(--warn); }
  .tile-stat.danger .num { color: var(--danger); }

  table.live { width: 100%; border-collapse: collapse; background: var(--card); border-radius: var(--radius-lg);
    overflow: hidden; box-shadow: var(--shadow-xs); font-size: .92rem; border: 1px solid var(--border); }
  table.live th, table.live td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--border); }
  table.live th { background: var(--card-hover); font-weight: 600; font-size: .78rem; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: .04em; cursor: pointer; user-select: none; white-space: nowrap; }
  table.live th:hover { background: var(--border); color: var(--text); }
  table.live tbody tr { cursor: pointer; transition: background .12s; }
  table.live tbody tr:hover { background: var(--card-hover); }
  table.live tbody tr:last-child td { border-bottom: 0; }
  table.live tbody tr.new-row { animation: flash 2s ease-out; }
  @keyframes flash { 0% { background: #dbeafe; } 100% { background: transparent; } }

  .pill { display: inline-block; padding: 3px 9px; border-radius: 99px; font-size: .72rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: .03em; }
  .pill.live     { background: #dbeafe; color: #1e40af; }
  .pill.done     { background: #dcfce7; color: #166534; }
  .pill.flag     { background: #fef3c7; color: #92400e; }
  .pill.forced   { background: #fee2e2; color: #991b1b; }
  .pill.abandon  { background: #e2e8f0; color: #475569; }

  .empty { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 60px 20px; text-align: center; color: var(--text-muted); box-shadow: var(--shadow-xs); }

  .status-bar { display: flex; align-items: center; gap: 8px; font-size: .85rem; color: var(--text-muted); }
  .status-bar .live-dot.off { animation: none; opacity: .4; background: #94a3b8; }

  /* ---------- DRAWER ---------- */
  .detail-back { position: fixed; inset: 0; background: rgba(15,23,42,.55); z-index: 100;
    display: flex; justify-content: flex-end; backdrop-filter: blur(2px); }
  .detail-back.hidden { display: none; }
  .detail { background: var(--card); width: 100%; max-width: 620px; height: 100%; overflow-y: auto;
    padding: 22px 22px 40px; box-shadow: -8px 0 24px rgba(0,0,0,.12); border-left: 1px solid var(--border); }
  .detail-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
  .detail-head h2 { margin: 0 0 4px; font-size: 1.1rem; }
  .detail-meta { color: var(--text-muted); font-size: .87rem; }
  .close-x { background: transparent; color: var(--text-muted); font-size: 1.4rem; padding: 4px 8px; cursor: pointer; border: 0; border-radius: 6px; }
  .close-x:hover { background: var(--card-hover); color: var(--text); }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; margin-bottom: 16px; }
  .stat-grid .item { background: var(--bg); border-radius: 8px; padding: 10px 12px; border: 1px solid var(--border); }
  .stat-grid .lbl { font-size: .72rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; }
  .stat-grid .val { font-size: 1.05rem; font-weight: 700; margin-top: 2px; }
  .qa { border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; overflow: hidden; background: var(--card); }
  .qa-head { padding: 10px 14px; background: var(--bg); font-size: .82rem; color: var(--text-muted); display: flex; justify-content: space-between; }
  .qa-body { padding: 12px 14px; }
  .qa-text { font-weight: 600; margin-bottom: 10px; font-size: .95rem; line-height: 1.45; }
  .qa-choices { list-style: none; padding: 0; margin: 0; font-size: .9rem; }
  .qa-choices li { padding: 6px 10px; border-radius: 6px; margin-bottom: 4px; display: flex; gap: 8px; }
  .qa-choices li.correct { background: var(--success-soft); color: var(--success); }
  .qa-choices li.wrong { background: var(--danger-soft); color: var(--danger); }
  .qa-choices li.picked { outline: 2px solid var(--border-strong); outline-offset: -2px; }
  .qa-choices li .mark { font-weight: 700; flex: 0 0 20px; }
  .events { background: var(--warn-soft); border: 1px solid var(--warn); border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; font-size: .87rem; color: var(--text); }
  .events h3 { margin: 0 0 8px; font-size: .9rem; color: var(--warn); }
  .events ul { margin: 0; padding-left: 18px; }
</style>
</head>
<body>

<header class="topbar">
  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="subjects.html">Subjects</a>
    <a href="questions.html">Questions</a>
    <a href="quizzes.html" class="active">Quizzes</a>
    <a href="settings.html">Settings</a>
  </nav>
  <div class="user">
    <span class="email" id="userEmail"></span>
    <button class="ghost small" id="btnLogout">Log out</button>
  </div>
</header>

<main class="container">
  <div id="head"></div>
  <div id="stats"></div>
  <div id="body"></div>
</main>

<!-- ATTEMPT DETAIL DRAWER -->
<div class="detail-back hidden" id="attemptDrawer">
  <div class="detail" id="drawerContent"></div>
</div>

<script type="module">
import { requireAuth, signOut, getUser, escapeHtml, supabase } from '../assets/supabase.js';
import { getQuiz, getAttemptDetail, setFlagged, setKept, deleteAttempt } from '../assets/admin/results.js';

const REFRESH_MS = 10000;

const session = await requireAuth('index.html');
if (!session) throw new Error('redirecting');
const user = await getUser();
document.getElementById('userEmail').textContent = user?.email || '';
document.getElementById('btnLogout').addEventListener('click', async (e) => {
  e.preventDefault(); await signOut(); location.replace('index.html');
});

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const QUIZ_ID = params.get('id');

if (!QUIZ_ID) {
  $('head').innerHTML = '<div class="card"><p>Missing quiz ID. <a href="quizzes.html">Go back</a>.</p></div>';
  throw new Error('no quiz id');
}

let quiz = null;
let knownAttemptIds = new Set();
let pollTimer = null;
let paused = false;

// Sorting state
let sortColumn = 'started_at';
let sortAsc = false;

async function boot() {
  try {
    quiz = await getQuiz(QUIZ_ID);
    renderHead();
    await refresh();
    pollTimer = setInterval(refresh, REFRESH_MS);
  } catch (err) {
    $('head').innerHTML = `<div class="msg error">${escapeHtml(err.message)}</div>`;
  }
}

function renderHead() {
  $('head').innerHTML = `
    <div class="card live-head">
      <div>
        <h1 style="margin:0 0 4px">
          <span class="live-dot" id="liveDot"></span>Live · ${escapeHtml(quiz.title)}
        </h1>
        <div style="color:var(--text-muted);font-size:.9rem;margin-top:4px">
          Auto-refreshing every 10 seconds · Code:
          <span style="font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:600">${escapeHtml(quiz.code)}</span>
        </div>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="ghost small" id="btnPause">Pause auto-refresh</button>
        <a class="btn ghost small" href="quiz-view.html?id=${quiz.id}">Results table</a>
        <a class="btn ghost small" href="quizzes.html">All quizzes</a>
      </div>
    </div>`;

  $('btnPause').addEventListener('click', () => {
    paused = !paused;
    if (paused) {
      clearInterval(pollTimer);
      pollTimer = null;
      $('btnPause').textContent = 'Resume auto-refresh';
      $('liveDot').classList.add('off');
    } else {
      pollTimer = setInterval(refresh, REFRESH_MS);
      $('btnPause').textContent = 'Pause auto-refresh';
      $('liveDot').classList.remove('off');
      refresh();
    }
  });
}

async function refresh() {
  const { data, error } = await supabase
    .from('attempts')
    .select('id, student_number, student_name, started_at, submitted_at, score, total_questions, percent, warning_count, submitted, abandoned, force_submitted, is_flagged, is_kept')
    .eq('quiz_id', QUIZ_ID)
    .order('started_at', { ascending: false })
    .limit(200);

  if (error) {
    $('body').innerHTML = `<div class="msg error">${escapeHtml(error.message)}</div>`;
    return;
  }

  const attempts = data || [];
  const newIds = new Set(attempts.map(a => a.id));

  const justArrived = new Set();
  if (knownAttemptIds.size > 0) {
    for (const id of newIds) if (!knownAttemptIds.has(id)) justArrived.add(id);
  }
  knownAttemptIds = newIds;

  renderStats(attempts);
  renderTable(attempts, justArrived);
}

function renderStats(attempts) {
  const inProgress = attempts.filter(a => !a.submitted && !a.abandoned).length;
  const submitted = attempts.filter(a => a.submitted).length;
  const flagged = attempts.filter(a => a.is_flagged).length;
  const forced = attempts.filter(a => a.force_submitted).length;

  $('stats').innerHTML = `
    <div class="tiles">
      <div class="tile-stat live"><div class="lbl">In progress</div><div class="num">${inProgress}</div></div>
      <div class="tile-stat"><div class="lbl">Submitted</div><div class="num">${submitted}</div></div>
      <div class="tile-stat warn"><div class="lbl">Flagged</div><div class="num">${flagged}</div></div>
      <div class="tile-stat danger"><div class="lbl">Forced</div><div class="num">${forced}</div></div>
    </div>`;
}

function getStatusWeight(a) {
  if (a.force_submitted) return 1;
  if (a.is_flagged) return 2;
  if (a.abandoned) return 3;
  if (!a.submitted) return 4;
  return 5;
}

function renderTable(attempts, justArrived) {
  if (!attempts.length) {
    $('body').innerHTML = '<div class="empty">No attempts yet. Waiting for students to open the quiz…</div>';
    return;
  }

  // Sort the array
  attempts.sort((a, b) => {
    let valA = a[sortColumn], valB = b[sortColumn];

    if (sortColumn === 'status') {
      valA = getStatusWeight(a);
      valB = getStatusWeight(b);
    } else if (sortColumn === 'student_name') {
      valA = (valA || '').toLowerCase();
      valB = (valB || '').toLowerCase();
    } else if (sortColumn === 'score') {
      valA = a.score || 0;
      valB = b.score || 0;
    } else if (sortColumn === 'warning_count') {
      valA = a.warning_count || 0;
      valB = b.warning_count || 0;
    } else if (sortColumn === 'started_at' || sortColumn === 'submitted_at') {
      valA = valA ? new Date(valA).getTime() : 0;
      valB = valB ? new Date(valB).getTime() : 0;
    }

    if (valA < valB) return sortAsc ? -1 : 1;
    if (valA > valB) return sortAsc ? 1 : -1;
    return 0;
  });

  const getArrow = (col) => {
    if (sortColumn !== col) return '';
    return sortAsc ? ' ↑' : ' ↓';
  };

  $('body').innerHTML = `
    <table class="live">
      <thead>
        <tr>
          <th data-sort="student_name">Name${getArrow('student_name')}</th>
          <th data-sort="student_number">Student No${getArrow('student_number')}</th>
          <th data-sort="status">Status${getArrow('status')}</th>
          <th data-sort="warning_count">Warnings${getArrow('warning_count')}</th>
          <th data-sort="score">Score${getArrow('score')}</th>
          <th data-sort="started_at">Started${getArrow('started_at')}</th>
          <th data-sort="submitted_at">Finished${getArrow('submitted_at')}</th>
        </tr>
      </thead>
      <tbody>
        ${attempts.map(a => {
          const cls = justArrived.has(a.id) ? 'new-row' : '';
          return `
            <tr class="${cls}" data-id="${a.id}">
              <td>${escapeHtml(a.student_name)}</td>
              <td>${escapeHtml(a.student_number)}</td>
              <td>${statusPill(a)}</td>
              <td>${a.warning_count || 0}${a.is_flagged ? ' <span class="pill flag">flag</span>' : ''}</td>
              <td>${a.submitted ? `${a.score}/${a.total_questions} (${a.percent}%)` : '—'}</td>
              <td>${fmtExactTime(a.started_at)}</td>
              <td>${a.submitted_at ? fmtExactTime(a.submitted_at) : '—'}</td>
            </tr>`;
        }).join('')}
      </tbody>
    </table>`;

  // Header click listeners
  $('body').querySelectorAll('th[data-sort]').forEach(th => {
    th.addEventListener('click', () => {
      const col = th.dataset.sort;
      if (sortColumn === col) {
        sortAsc = !sortAsc; // Toggle direction
      } else {
        sortColumn = col;
        sortAsc = true; // Default to ascending for new column
      }
      refresh(); // Re-render immediately
    });
  });

  $('body').querySelectorAll('tbody tr').forEach(tr => {
    tr.addEventListener('click', () => {
      openAttemptDrawer(tr.dataset.id);
    });
  });
}

function statusPill(a) {
  if (a.abandoned) return '<span class="pill abandon">abandoned</span>';
  if (a.submitted && a.force_submitted) return '<span class="pill forced">forced submit</span>';
  if (a.submitted) return '<span class="pill done">submitted</span>';
  return '<span class="pill live">in progress</span>';
}

function fmtExactTime(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  const dateStr = d.toLocaleDateString([], { month: 'short', day: 'numeric' });
  const timeStr = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  return `${dateStr}, ${timeStr}`;
}

/* ============================================================
   DRAWER LOGIC
   ============================================================ */
async function openAttemptDrawer(attemptId) {
  const drawer = $('attemptDrawer');
  const content = $('drawerContent');
  
  drawer.classList.remove('hidden');
  content.innerHTML = '<div style="padding:40px;text-align:center;color:var(--text-muted)">Loading attempt details…</div>';

  try {
    const { attempt, answers, events } = await getAttemptDetail(attemptId);
    
    const eventsHtml = events.length ? `
      <div class="events">
        <h3>⚠️ Anti-Cheat Events</h3>
        <ul>${events.map(e => `<li><strong>${new Date(e.at).toLocaleDateString()}</strong> at ${new Date(e.at).toLocaleTimeString()} - ${e.event_type}</li>`).join('')}</ul>
      </div>
    ` : '';

    const letters = ['A','B','C','D','E','F','G','H'];
    const answersHtml = answers.map((ans, i) => {
      const q = ans.questions;
      return `
        <div class="qa">
          <div class="qa-head">
            <span>Question ${i + 1}</span>
            <span>${ans.is_correct ? '✅ Correct' : (ans.choice_id ? '❌ Incorrect' : '⚪ Skipped')}</span>
          </div>
          <div class="qa-body">
            <div class="qa-text">${escapeHtml(q?.text || '')}</div>
            <ul class="qa-choices">
              ${q?.choices?.map((c, ci) => {
                let cls = '';
                if (c.is_correct) cls = 'correct';
                else if (c.id === ans.choice_id) cls = 'wrong';
                if (c.id === ans.choice_id) cls += ' picked';
                return `<li class="${cls}">
                  <span class="mark">${letters[ci]}</span>
                  <span>${escapeHtml(c.text)}</span>
                </li>`;
              }).join('')}
            </ul>
          </div>
        </div>
      `;
    }).join('');

    content.innerHTML = `
      <div class="detail-head">
        <div>
          <h2>${escapeHtml(attempt.student_name)}</h2>
          <div class="detail-meta">
            ${escapeHtml(attempt.student_number)} · ${attempt.submitted ? 'Submitted' : 'In Progress'}
          </div>
        </div>
        <button class="close-x" onclick="document.getElementById('attemptDrawer').classList.add('hidden')">✕</button>
      </div>
      
      <div class="stat-grid">
        <div class="item">
          <div class="lbl">Score</div>
          <div class="val">${attempt.score ?? '—'} / ${attempt.total_questions}</div>
        </div>
        <div class="item">
          <div class="lbl">Percentage</div>
          <div class="val">${attempt.percent ? attempt.percent + '%' : '—'}</div>
        </div>
        <div class="item">
          <div class="lbl">Warnings</div>
          <div class="val" style="${attempt.warning_count > 0 ? 'color:var(--warn)' : ''}">${attempt.warning_count}</div>
        </div>
      </div>

      <div style="display:flex; gap:10px; margin-bottom:24px; flex-wrap:wrap; align-items:center;">
        <button class="ghost" id="btnKeep">
          ⭐ ${attempt.is_kept ? 'Unkeep attempt' : 'Mark as kept'}
        </button>
        <button class="ghost" id="btnToggleFlag">
          🚩 ${attempt.is_flagged ? 'Clear flag' : 'Flag this attempt'}
        </button>
        <button class="danger" id="btnDeleteAttempt">Delete attempt</button>
      </div>

      ${eventsHtml}
      ${answersHtml}
    `;

    $('btnToggleFlag').addEventListener('click', async () => {
      try {
        await setFlagged(attemptId, !attempt.is_flagged);
        refresh(); 
        openAttemptDrawer(attemptId); 
      } catch (err) { alert(err.message); }
    });

    $('btnKeep').addEventListener('click', async () => {
      try {
        await setKept(attemptId, !attempt.is_kept);
        refresh();
        openAttemptDrawer(attemptId);
      } catch (err) { alert(err.message); }
    });

    $('btnDeleteAttempt').addEventListener('click', async () => {
      if (!confirm('Are you sure you want to delete this attempt? This cannot be undone.')) return;
      try {
        await deleteAttempt(attemptId);
        drawer.classList.add('hidden');
        refresh(); 
      } catch (err) { alert(err.message); }
    });

  } catch (err) {
    content.innerHTML = `<div class="msg error">${escapeHtml(err.message)}</div>`;
  }
}

$('attemptDrawer').addEventListener('click', (e) => {
  if (e.target.id === 'attemptDrawer') {
    e.target.classList.add('hidden');
  }
});

boot();
</script>
</body>
</html>
