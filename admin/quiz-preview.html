<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Preview · Quiz Platform Champ</title>
<link rel="icon" type="image/svg+xml" href="../assets/logo-icon.svg">
<link rel="stylesheet" href="../assets/admin/admin.css">
<style>
  .head-card { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; justify-content: space-between; }
  .head-card h1 { margin: 0 0 4px; }
  .head-meta { color: var(--muted); font-size: .9rem; }

  .toggle-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 16px 0; }
  .toggle-row label { display: flex; align-items: center; gap: 6px; font-size: .9rem; color: var(--muted); }

  .pool-note {
    background: #eff4ff; color: #1e40af;
    padding: 10px 14px; border-radius: 8px;
    font-size: .88rem; margin-bottom: 16px;
  }

  .q-card { background: #fff; border-radius: 12px; box-shadow: var(--shadow);
            padding: 18px 22px; margin-bottom: 12px; page-break-inside: avoid; }
  .q-head { display: flex; justify-content: space-between; align-items: center;
            font-size: .78rem; color: var(--muted); margin-bottom: 10px;
            text-transform: uppercase; letter-spacing: .04em; }
  .q-text { font-size: 1rem; font-weight: 600; line-height: 1.45; margin-bottom: 14px; }
  .q-choices { list-style: none; padding: 0; margin: 0; }
  .q-choices li {
    padding: 8px 12px; border-radius: 6px; margin-bottom: 6px;
    background: #f7f9fc; display: flex; gap: 10px; font-size: .95rem;
  }
  .q-choices li.correct { background: #dcfce7; color: #166534; font-weight: 600; }
  .q-choices .letter {
    flex: 0 0 22px; height: 22px; border-radius: 50%;
    background: #e2e8f0; color: var(--muted);
    display: flex; align-items: center; justify-content: center;
    font-size: .75rem; font-weight: 700; margin-top: 1px;
  }
  .q-choices li.correct .letter { background: #16a34a; color: #fff; }
  .key-note { font-size: .8rem; color: var(--muted); margin-top: 8px; font-style: italic; }

  /* print styles */
  @media print {
    .topbar, .toolbar-actions, .toggle-row, .no-print { display: none !important; }
    body { background: #fff; font-size: 12pt; }
    .container { max-width: 100%; padding: 0; }
    .card, .q-card { box-shadow: none !important; border: 1px solid #ddd; }
    .q-card { page-break-inside: avoid; }
    .q-choices li { background: #f5f5f5 !important; }
    .q-choices li.correct { background: #e8f8ec !important; }
    a { color: inherit; text-decoration: none; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <img src="../assets/logo-icon.svg" alt="" width="26" height="26">
    <span>Quiz Platform <strong>Champ</strong></span>
  </div>
  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="subjects.html">Subjects</a>
    <a href="questions.html">Questions</a>
    <a href="quizzes.html" class="active">Quizzes</a>
    <a href="settings.html">Settings</a>
  </nav>
  <div class="user">
    <span class="email" id="userEmail"></span>
    <button class="ghost small" id="btnLogout">Log out</button>
  </div>
</header>

<main class="container">
  <div id="head"></div>

  <div class="toggle-row no-print">
    <label>
      <input type="checkbox" id="toggleKey" checked>
      Show correct answers
    </label>
    <label>
      <input type="checkbox" id="toggleShuffle">
      Shuffle question order
    </label>
    <div style="flex:1"></div>
    <button class="ghost small" id="btnPrint">🖨 Print</button>
    <button class="ghost small" id="btnPrintKeyOnly">🖨 Print answer key only</button>
  </div>

  <div id="poolNote"></div>
  <div id="questions"></div>
</main>

<script type="module">
import { requireAuth, signOut, getUser, escapeHtml, fmtDate, toast } from '../assets/supabase.js';
import { getQuiz } from '../assets/admin/results.js';
import { listQuestions } from '../assets/admin/questions.js';

const session = await requireAuth('index.html');
if (!session) throw new Error('redirecting');
const user = await getUser();
document.getElementById('userEmail').textContent = user?.email || '';
document.getElementById('btnLogout').addEventListener('click', async (e) => {
  e.preventDefault(); await signOut(); location.replace('index.html');
});

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const QUIZ_ID = params.get('id');

if (!QUIZ_ID) {
  $('head').innerHTML = '<div class="card"><p>Missing quiz ID. <a href="quizzes.html">Go back</a>.</p></div>';
  throw new Error('no quiz id');
}

let quiz = null;
let questions = [];

async function load() {
  $('head').innerHTML = '<div class="card"><p style="color:var(--muted)">Loading…</p></div>';
  try {
    quiz = await getQuiz(QUIZ_ID);
    questions = await listQuestions(quiz.period_id);
    renderHead();
    renderPoolNote();
    renderQuestions();
    wireToggles();
  } catch (err) {
    $('head').innerHTML = `<div class="msg error">${escapeHtml(err.message)}</div>`;
  }
}

function renderHead() {
  const subjectName = quiz.subjects?.name || '—';
  const periodName  = quiz.periods?.name  || '—';
  $('head').innerHTML = `
    <div class="card head-card">
      <div>
        <h1>${escapeHtml(quiz.title)}</h1>
        <div class="head-meta">
          ${escapeHtml(subjectName)} · ${escapeHtml(periodName)} ·
          Serves <strong>${quiz.num_questions}</strong> question${quiz.num_questions === 1 ? '' : 's'} per student
        </div>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap" class="no-print">
        <a class="btn ghost small" href="quiz-view.html?id=${quiz.id}">← Results</a>
        <a class="btn ghost small" href="quizzes.html">All quizzes</a>
      </div>
    </div>`;
}

function renderPoolNote() {
  $('poolNote').innerHTML = `
    <div class="pool-note no-print">
      Pool has <strong>${questions.length}</strong> question${questions.length === 1 ? '' : 's'}.
      Each student will get a random <strong>${quiz.num_questions}</strong>.
      ${questions.length < quiz.num_questions
        ? `<span style="color:#991b1b">Not enough questions in the pool — add more.</span>`
        : ''}
    </div>`;
}

function renderQuestions() {
  if (!questions.length) {
    $('questions').innerHTML = '<div class="card"><p style="color:var(--muted)">No questions in the pool yet.</p></div>';
    return;
  }

  const showKey = $('toggleKey').checked;
  const shuffle = $('toggleShuffle').checked;

  let list = questions.slice();
  if (shuffle) list = shuffleArray(list);

  const letters = ['A','B','C','D','E','F','G','H'];

  $('questions').innerHTML = list.map((q, idx) => {
    const choices = (q.choices || []).slice().sort((a, b) => a.position - b.position);
    const choiceList = shuffle && !showKey
      ? shuffleArray(choices)
      : choices;

    return `
      <div class="q-card">
        <div class="q-head">
          <span>Question ${idx + 1}</span>
          <span>Served ${q.served_count || 0} time${(q.served_count || 0) === 1 ? '' : 's'}</span>
        </div>
        <div class="q-text">${escapeHtml(q.text)}</div>
        <ul class="q-choices">
          ${choiceList.map((c, i) => {
            const cls = (showKey && c.is_correct) ? 'correct' : '';
            return `<li class="${cls}"><span class="letter">${letters[i]}</span><span>${escapeHtml(c.text)}</span></li>`;
          }).join('')}
        </ul>
      </div>`;
  }).join('');

  if (showKey) {
    $('questions').insertAdjacentHTML('beforeend',
      `<p class="key-note no-print" style="text-align:center">Correct answers are highlighted in green.</p>`);
  }
}

function wireToggles() {
  $('toggleKey').addEventListener('change', renderQuestions);
  $('toggleShuffle').addEventListener('change', renderQuestions);
  $('btnPrint').addEventListener('click', () => window.print());

  $('btnPrintKeyOnly').addEventListener('click', () => {
    // force key on, hide the extra toggles, then print
    $('toggleKey').checked = true;
    $('toggleShuffle').checked = false;
    renderQuestions();
    setTimeout(() => window.print(), 100);
  });
}

function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

load();
</script>
</body>
</html>
