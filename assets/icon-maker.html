<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Icon Maker · Quiz Platform Champ</title>
<style>
  body { font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         max-width: 640px; margin: 40px auto; padding: 20px; color: #1a202c; }
  h1 { font-size: 1.4rem; }
  .row { background: #f7f9fc; border-radius: 12px; padding: 20px; margin-bottom: 16px;
         display: flex; align-items: center; gap: 20px; }
  .row canvas { border-radius: 12px; box-shadow: 0 4px 12px rgba(0,0,0,.1); }
  .row .info { flex: 1; }
  .row h2 { margin: 0 0 6px; font-size: 1.05rem; }
  .row p { margin: 0 0 12px; color: #64748b; font-size: .9rem; }
  button { background: #2563eb; color: #fff; border: 0; padding: 10px 18px;
           border-radius: 8px; font-size: .95rem; font-weight: 600; cursor: pointer; font-family: inherit; }
  button:hover { background: #1d4ed8; }
  .note { background: #eff6ff; color: #1e40af; padding: 14px 16px; border-radius: 10px;
          font-size: .9rem; margin-bottom: 20px; }
</style>
</head>
<body>
<h1>Icon Maker</h1>
<div class="note">
  Click each <strong>Download</strong> button. Save both files into your <code>assets/</code> folder as
  <code>icon-192.png</code> and <code>icon-512.png</code>. Then delete this file.
</div>

<div class="row">
  <canvas id="c192" width="192" height="192"></canvas>
  <div class="info">
    <h2>icon-192.png</h2>
    <p>Android home screen icon</p>
    <button onclick="download(192)">Download 192×192</button>
  </div>
</div>

<div class="row">
  <canvas id="c512" width="512" height="512"></canvas>
  <div class="info">
    <h2>icon-512.png</h2>
    <p>High-res icon (splash screens, app stores)</p>
    <button onclick="download(512)">Download 512×512</button>
  </div>
</div>

<script>
const svg = `
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#g)"/>
  <path d="M20 22c-8 0-9 9-3 11" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M44 22c8 0 9 9 3 11" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M20 15h24v15a12 12 0 0 1-24 0V15Z" fill="#fff"/>
  <rect x="29" y="42" width="6" height="5" fill="#fff"/>
  <rect x="21" y="47" width="22" height="5" rx="1.5" fill="#fff"/>
  <path d="M26 27l4 4 8-9" stroke="#2563eb" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>`;

const img = new Image();
img.src = 'data:image/svg+xml;base64,' + btoa(svg);
img.onload = () => {
  draw(192);
  draw(512);
};

function draw(size) {
  const c = document.getElementById('c' + size);
  const ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0, size, size);
}

function download(size) {
  const c = document.getElementById('c' + size);
  c.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `icon-${size}.png`;
    a.click();
    URL.revokeObjectURL(a.href);
  }, 'image/png');
}
</script>
</body>
</html>
